<div class="grid grid-cols-2 md:grid-cols-6 xl:grid-cols-6 gap-x-7">

	<div class="col-span-2 md:col-span-3">
		<span class="block relative">
			[text* your-name autocomplete:name]
			<label for="your-name">Vorname</label>
		</span>
		<span class="block relative">
			[email* your-email autocomplete:email]
			<label for="your-email">E-Mail</label>
		</span>
	</div>

	<div class="col-span-2 md:col-span-3">
		<span class="block relative">
			[text* your-surname autocomplete:surname]
			<label class="your-surname">Nachname</label>
		</span>
		<span class="block relative">
			[tel* your-phone autocomplete:phone]
			<label for="your-phone">Telefon</label>
		</span>
	</div>

	<div class="col-span-2 md:col-span-6">
		<span class="block relative">
			[textarea* your-message 2x6]
			<label for="your-message">Kommentare</label>
		</span>
	</div>

	<div class="col-span-2 md:col-span-2">
		<span class="wpcf7-form-footer">[submit "Nachricht senden"]</span>
	</div>

</div>
